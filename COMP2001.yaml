about_exam:
  - content: |
      期末考试难度整体适中，打分较友好，最高分 93 左右，平均分 80 左右。挂科率大约在百分之一到百分之二。
      考试主要考查各种知识的概念，主要是简答题，要记背的东西非常多！！
    submitter:
      name: ""
      link: ""
study_advice:
  - content: "作业一定要认真完成！！每个老师作业不一样，比如我们老师所有作业加起来共100道选择题，错一道题最终就扣一分，导致有同学作业分是 47 分（满分 100）!"
    submitter:
      name: ""
      link: ""
  - content: "考试复习时，建议以背诵 PPT 为主，能背多少背多少，同时也可以将老师给的主观题答案背下来。"
    submitter:
      name: ""
      link: ""
